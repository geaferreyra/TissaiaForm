<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<style> html, body { margin: 0; padding: 0; background: #1c1420; } </style>
<div id="tissaia-root"></div>
<style>
  #tissaia-root, #tissaia-root * { box-sizing: border-box; }
  #tissaia-root {
    --ink: #f4ede6;
    --ink-dim: #c9b8ba;
    --bg: #1c1420;
    --bg-raised: #251b2c;
    --bg-field: #2c2033;
    --plum: #5c2a4d;
    --gold: #c9a66b;
    --gold-soft: rgba(201,166,107,0.18);
    --blush: #d99aa4;
    --ok: #7fae8a;
    --danger: #d97757;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 84px;
    position: relative;
  }
  #tissaia-root .header {
    padding: 28px 20px 18px;
    text-align: center;
    border-bottom: 1px solid rgba(201,166,107,0.25);
    background: linear-gradient(180deg, var(--plum) 0%, var(--bg) 100%);
  }
  #tissaia-root .brand {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 26px;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin: 0;
  }
  #tissaia-root .stitch {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    margin: 8px 0 2px;
  }
  #tissaia-root .stitch span {
    width: 5px; height: 1px; background: var(--gold); opacity: 0.6;
  }
  #tissaia-root .subbrand {
    font-size: 11.5px; color: var(--ink-dim); letter-spacing: 0.14em; text-transform: uppercase;
  }
  #tissaia-root .panel { display: none; padding: 18px 18px 8px; animation: fadein .2s ease; }
  #tissaia-root .panel.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to {opacity:1; transform: translateY(0);} }

  #tissaia-root h2 {
    font-family: Georgia, serif; font-weight: 400; font-size: 19px; color: var(--ink);
    margin: 4px 0 4px;
  }
  #tissaia-root .hint { font-size: 12.5px; color: var(--ink-dim); margin: 0 0 18px; line-height: 1.5; }

  #tissaia-root label {
    display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--gold); margin: 16px 0 6px;
  }
  #tissaia-root input[type=text], #tissaia-root input[type=number], #tissaia-root input[type=date],
  #tissaia-root select, #tissaia-root textarea {
    width: 100%; padding: 12px 13px; border-radius: 10px; border: 1px solid rgba(201,166,107,0.3);
    background: var(--bg-field); color: var(--ink); font-size: 15px; outline: none;
  }
  #tissaia-root input:focus, #tissaia-root select:focus, #tissaia-root textarea:focus {
    border-color: var(--gold);
  }
  #tissaia-root select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%); background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

  #tissaia-root .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #tissaia-root .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; min-height: 30px; }
  #tissaia-root .chip {
    background: var(--gold-soft); border: 1px solid var(--gold); color: var(--gold);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; display: flex; align-items: center; gap: 6px;
  }
  #tissaia-root .chip button { background: none; border: none; color: var(--gold); font-size: 14px; cursor: pointer; line-height: 1; padding: 0; }
  #tissaia-root .add-chip-row { display: flex; gap: 8px; margin-top: 8px; }
  #tissaia-root .ajuste-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 6px;
    background: var(--bg-field); border: 1px solid rgba(201,166,107,0.25); border-radius: 10px;
  }
  #tissaia-root .ajuste-row .ajuste-nombre { flex: 1; font-size: 13.5px; }
  #tissaia-root .ajuste-row .ajuste-signo {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--gold); background: none;
    color: var(--gold); font-size: 15px; cursor: pointer; flex-shrink: 0;
  }
  #tissaia-root .ajuste-row .ajuste-pct {
    width: 52px; padding: 6px; text-align: center; background: var(--bg); border: 1px solid rgba(201,166,107,0.3);
    border-radius: 8px; color: var(--ink); font-size: 13.5px;
  }
  #tissaia-root .ajuste-row .ajuste-borrar { background: none; border: none; color: var(--ink-dim); font-size: 14px; cursor: pointer; }
  #tissaia-root .ajuste-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--gold); flex-shrink: 0; }
  #tissaia-root .add-chip-row input { flex: 1; }
  #tissaia-root .btn-mini {
    background: var(--bg-field); border: 1px solid var(--gold); color: var(--gold);
    border-radius: 10px; padding: 0 16px; font-size: 14px; cursor: pointer;
  }

  #tissaia-root .btn-primary {
    width: 100%; margin-top: 26px; padding: 15px; border-radius: 12px; border: none;
    background: var(--gold); color: #1c1420; font-weight: 600; font-size: 15px; letter-spacing: 0.03em;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  #tissaia-root .btn-primary:active { transform: scale(0.99); }
  #tissaia-root .btn-primary:disabled { opacity: 0.75; cursor: wait; }
  #tissaia-root .spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(28,20,32,0.3); border-top-color: #1c1420;
    animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #tissaia-root .btn-secondary {
    width: 100%; margin-top: 10px; padding: 13px; border-radius: 12px;
    background: transparent; border: 1px solid rgba(201,166,107,0.4); color: var(--ink-dim); font-size: 14px; cursor: pointer;
  }
  #tissaia-root .type-toggle { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  #tissaia-root .type-toggle button {
    padding: 12px 4px; border-radius: 10px; border: 1px solid rgba(201,166,107,0.3);
    background: var(--bg-field); color: var(--ink-dim); font-size: 13.5px; cursor: pointer;
  }
  #tissaia-root .type-toggle button.active { background: var(--gold); color: #1c1420; border-color: var(--gold); font-weight: 600; }
  #tissaia-root .pay-toggle { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 4px; }
  #tissaia-root .pay-toggle button {
    padding: 10px 2px; border-radius: 9px; border: 1px solid rgba(201,166,107,0.3);
    background: var(--bg-field); color: var(--ink-dim); font-size: 12.5px; cursor: pointer;
  }
  #tissaia-root .pay-toggle button.active { background: var(--blush); color: #1c1420; border-color: var(--blush); font-weight: 600; }

  #tissaia-root .suggested-price {
    margin-top: 8px; font-size: 12.5px; color: var(--ink-dim);
  }
  #tissaia-root .suggested-price b { color: var(--gold); }

  #tissaia-root .search-result {
    padding: 12px 13px; border: 1px solid rgba(201,166,107,0.25); border-radius: 10px;
    margin-top: 8px; cursor: pointer; background: var(--bg-field);
  }
  #tissaia-root .search-result:active { background: var(--gold-soft); }
  #tissaia-root .search-result .sr-code { color: var(--gold); font-size: 12px; letter-spacing: 0.04em; }
  #tissaia-root .search-result .sr-desc { font-size: 14.5px; margin-top: 2px; }
  #tissaia-root .selected-product {
    background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 10px; padding: 12px 13px; margin-top: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #tissaia-root .selected-product .sp-code { color: var(--gold); font-size: 12px; }
  #tissaia-root .selected-product button { background: none; border: none; color: var(--ink-dim); font-size: 13px; cursor: pointer; text-decoration: underline; }

  #tissaia-root .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-dim); }
  #tissaia-root .empty-state .es-mark { font-size: 30px; color: var(--gold); margin-bottom: 10px; }

  #tissaia-root .queue-item {
    border: 1px solid rgba(201,166,107,0.25); border-radius: 10px; padding: 12px 13px; margin-bottom: 10px;
    background: var(--bg-raised);
  }
  #tissaia-root .queue-item .qi-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--gold); }
  #tissaia-root .queue-item .qi-desc { font-size: 14.5px; margin-top: 4px; }
  #tissaia-root .queue-item .qi-meta { font-size: 12px; color: var(--ink-dim); margin-top: 4px; }

  #tissaia-root .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
    background: var(--bg-raised); border-top: 1px solid rgba(201,166,107,0.25);
    padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
  }
  #tissaia-root .tabbar button {
    background: none; border: none; color: var(--ink-dim); font-size: 11.5px; letter-spacing: 0.03em;
    display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 4px;
  }
  #tissaia-root .tabbar button .ic { font-size: 18px; }
  #tissaia-root .tabbar button.active { color: var(--gold); }
  #tissaia-root .toast {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    background: var(--ok); color: #12261a; padding: 10px 16px 10px 20px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; opacity: 0; transition: opacity .2s ease; pointer-events: none;
    max-width: 90%; text-align: center; z-index: 50; display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  #tissaia-root .toast.show { opacity: 1; pointer-events: auto; }
  #tissaia-root .toast .toast-x {
    background: rgba(18,38,26,0.15); border-radius: 50%; width: 20px; height: 20px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
  }
  #tissaia-root .error-overlay {
    position: fixed; inset: 0; background: rgba(10,6,12,0.6); z-index: 90;
    display: none; align-items: flex-end; justify-content: center;
  }
  #tissaia-root .error-overlay.show { display: flex; }
  #tissaia-root .error-card {
    background: var(--bg-raised); border: 1px solid var(--danger); border-radius: 16px 16px 0 0;
    max-width: 480px; width: 100%; padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
    animation: slideup .2s ease;
  }
  @keyframes slideup { from { transform: translateY(20px); opacity:0; } to { transform: translateY(0); opacity:1; } }
  #tissaia-root .error-card .ec-title { color: var(--danger); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-bottom: 8px; }
  #tissaia-root .error-card .ec-msg { font-size: 15px; line-height: 1.5; color: var(--ink); margin-bottom: 18px; }
  #tissaia-root .error-card button {
    width: 100%; padding: 13px; border-radius: 12px; border: none;
    background: var(--danger); color: #2a140c; font-weight: 700; font-size: 14.5px; cursor: pointer;
  }
  #tissaia-root .copybox {
    width: 100%; min-height: 90px; font-family: monospace; font-size: 11px; color: var(--ink-dim);
    background: var(--bg-field); border: 1px solid rgba(201,166,107,0.3); border-radius: 10px; padding: 10px;
  }
  #tissaia-root .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-dim); margin: 22px 0 8px;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  const CATS = [
    ["Accesorio","ACC"],["Arnes","ARN"],["Bikini","BIK"],["Body","BOD"],["Bombacha","BOM"],
    ["Boxer","BOX"],["Bralette","BRA"],["Bralette con arco","BCA"],["Bralette sin arco","BSA"],
    ["Cancan","CAN"],["Colaless","COL"],["Corpiño","COR"],["Culote","CUL"],["Deportivo","DEP"],
    ["Medias","MED"],["Pijama","PIJ"],["Simple Algodón","SIM"],["Slip","SLI"],["Soquetes","SOQ"],
    ["Taza Soft con arco","TCA"],["Taza Soft sin arco","TSA"],["Térmicas","TER"],["Vedetina","VED"],
    ["Guantes","GUA"],["Malla","MAL"],["Pezoneras","PEZ"]
  ];
  const MARGENES = {
    "Accesorio":[0.50,0.30],"Arnes":[0.45,0.28],"Bikini":[0.55,0.35],"Body":[0.55,0.35],
    "Bombacha":[0.50,0.30],"Boxer":[0.45,0.28],"Bralette":[0.55,0.35],"Bralette con arco":[0.55,0.35],
    "Bralette sin arco":[0.55,0.35],"Cancan":[0.45,0.28],"Colaless":[0.50,0.30],"Corpiño":[0.55,0.35],
    "Culote":[0.50,0.30],"Deportivo":[0.45,0.28],"Medias":[0.40,0.25],"Pijama":[0.50,0.30],
    "Simple Algodón":[0.45,0.28],"Slip":[0.50,0.30],"Soquetes":[0.40,0.25],
    "Taza Soft con arco":[0.55,0.35],"Taza Soft sin arco":[0.55,0.35],"Térmicas":[0.45,0.28],
    "Vedetina":[0.55,0.35],"Guantes":[0.45,0.28],"Malla":[0.45,0.28],"Pezoneras":[0.45,0.28]
  };
  const UMBRAL_MAYOR = 6;
  const CODE_OFFSET = 9000; // los codigos nuevos generados desde la app arrancan en 9000+ para no chocar con los del Excel

  let PRODUCTOS = {};       // codigoBase -> objeto producto
  let CONTADORES = {};      // abrev -> numero
  let PEND_MOV = [];        // movimientos pendientes de exportar
  let PEND_PROD = [];       // productos/variantes pendientes de exportar
  let productoSeleccionado = null;
  let talleColorSeleccion = null;

  const root = document.getElementById('tissaia-root');

  function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function fmtMoney(n){ return '$' + (Math.round(n*100)/100).toLocaleString('es-AR'); }

  // ---------- Formato de moneda en vivo para inputs de costo/precio ----------
  function formatearInputMoneda(texto){
    let s = String(texto).replace(/[^\d,]/g, '');
    const partes = s.split(',');
    let entero = (partes[0] || '').replace(/^0+(?=\d)/, '').replace(/\D/g, '');
    entero = entero.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    if(partes.length > 1){
      const decimales = partes.slice(1).join('').replace(/\D/g, '').slice(0, 2);
      return entero + ',' + decimales;
    }
    return entero;
  }
  function parseMoneyInput(str){
    if(!str) return 0;
    const limpio = String(str).replace(/\./g, '').replace(',', '.');
    return parseFloat(limpio) || 0;
  }
  function attachMoneyMask(input){
    if(!input || input.dataset.moneyMask) return;
    input.dataset.moneyMask = '1';
    input.addEventListener('input', ()=>{
      const cursorAlFinal = input.selectionStart === input.value.length;
      input.value = formatearInputMoneda(input.value);
      if(cursorAlFinal) input.setSelectionRange(input.value.length, input.value.length);
    });
  }
  function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
  function toast(msg){
    const t = root.querySelector('.toast');
    t.querySelector('.toast-msg').textContent = msg;
    t.classList.add('show');
  }
  function initToast(){
    const t = root.querySelector('.toast');
    t.addEventListener('click', ()=> t.classList.remove('show'));
  }
  function showError(msg){
    const overlay = root.querySelector('.error-overlay');
    overlay.querySelector('.ec-msg').textContent = msg;
    overlay.classList.add('show');
  }
  // se conecta una sola vez, al armar el layout general
  function initErrorOverlay(){
    const overlay = root.querySelector('.error-overlay');
    overlay.querySelector('#btn-error-ok').addEventListener('click', ()=> overlay.classList.remove('show'));
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('show'); });
  }
  function setLoading(btn, loading, textoCargando){
    if(loading){
      btn.dataset.textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span>${textoCargando || 'Guardando…'}`;
    } else {
      btn.disabled = false;
      btn.innerHTML = btn.dataset.textoOriginal || btn.innerHTML;
    }
  }

  // ---------- Capa de almacenamiento con respaldo ----------
  // Si el archivo se abre DENTRO de Claude (como artifact), usa window.storage (persiste en la nube).
  // Si se abre como HTML suelto en el navegador del celular, window.storage no existe:
  // en ese caso usamos localStorage del propio navegador, que persiste igual en ese dispositivo.
  const LS_PREFIX = 'tissaia_';
  const usingFallback = !(window.storage && typeof window.storage.get === 'function');

  const storageAPI = usingFallback ? {
    async get(key){
      const v = localStorage.getItem(LS_PREFIX + key);
      if (v === null) throw new Error('not found');
      return { key, value: v };
    },
    async set(key, value){
      localStorage.setItem(LS_PREFIX + key, value);
      return { key, value };
    }
  } : window.storage;

  async function safeGet(key, fallback){
    try {
      const r = await storageAPI.get(key);
      return r ? JSON.parse(r.value) : fallback;
    } catch(e){ return fallback; }
  }
  async function safeSet(key, value){
    try {
      await storageAPI.set(key, JSON.stringify(value));
      return true;
    } catch(e){
      toast('No se pudo guardar (' + e.message + ')');
      return false;
    }
  }

  async function loadAll(){
    PRODUCTOS   = await safeGet('productos', {});
    CONTADORES  = await safeGet('contadores', {});
    PEND_MOV    = await safeGet('pendientes_movimientos', []);
    PEND_PROD   = await safeGet('pendientes_productos', []);
    SHEETS_URL  = await safeGet('sheets_url', '');
    const margenesGuardados = await safeGet('margenes', null);
    if(margenesGuardados) Object.assign(MARGENES, margenesGuardados);
  }
  async function saveProductos(){ return safeSet('productos', PRODUCTOS); }
  async function saveContadores(){ return safeSet('contadores', CONTADORES); }
  async function savePendMov(){ return safeSet('pendientes_movimientos', PEND_MOV); }
  async function savePendProd(){ return safeSet('pendientes_productos', PEND_PROD); }
  async function saveSheetsUrl(){ return safeSet('sheets_url', SHEETS_URL); }
  async function saveMargenes(){ return safeSet('margenes', MARGENES); }

  // ---------- Conexión con Google Sheets (Apps Script) ----------
  let SHEETS_URL = '';

  async function sheetsGet(params){
    if(!SHEETS_URL) return null;
    // Cache-busting: Chrome (y a veces Google) cachean el GET porque la URL es siempre igual.
    // Sin esto, "Sincronizar" puede devolver una respuesta vieja aunque la planilla ya haya cambiado.
    const url = SHEETS_URL + (SHEETS_URL.includes('?') ? '&' : '?') + params + '&_=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  async function sheetsPost(payload){
    if(!SHEETS_URL) return null;
    // Sin header Content-Type explícito: evita el preflight CORS que Apps Script no responde.
    const res = await fetch(SHEETS_URL, { method: 'POST', body: JSON.stringify(payload) });
    if(!res.ok) throw new Error('HTTP ' + res.status); // error de conexión/servidor
    const json = await res.json();
    if(!json.ok){
      const err = new Error(json.error || 'Error desconocido');
      err.esValidacion = true; // el script corrió bien pero rechazó el dato (duplicado, sin stock, etc.)
      throw err;
    }
    return json;
  }

  async function sincronizarCatalogoDesdeSheets(silencioso){
    if(!SHEETS_URL) return false;
    try {
      const data = await sheetsGet('action=catalogo');
      if(data && data.productos){
        PRODUCTOS = data.productos;
        // nos quedamos con el contador mas alto entre lo local y lo que vino de la hoja
        Object.keys(data.contadores || {}).forEach(abbr=>{
          if(!CONTADORES[abbr] || CONTADORES[abbr] < data.contadores[abbr]) CONTADORES[abbr] = data.contadores[abbr];
        });
        await saveProductos(); await saveContadores();

        // Traer también los % de margen por categoría vigentes en la planilla
        // (si los cambiaste directo en Sheets, sin esto la app seguía usando los valores viejos)
        try {
          const catData = await sheetsGet('action=categorias');
          (catData && catData.categorias || []).forEach(c=>{
            MARGENES[c.categoria] = [c.margenMenor, c.margenMayor];
          });
          await saveMargenes();
        } catch(e){ /* si esto falla no bloqueamos la sincronizacion del catalogo */ }

        if(!silencioso) toast('Catálogo sincronizado con Google Sheets');
        return true;
      }
    } catch(e){
      if(!silencioso) toast('No se pudo sincronizar: ' + e.message);
    }
    return false;
  }

  function nextCode(abbr){
    const base = CONTADORES[abbr] || CODE_OFFSET;
    const next = base + 1;
    CONTADORES[abbr] = next;
    return abbr + '-' + next;
  }

  // ---------- estructura general ----------
  root.innerHTML = `
    <div class="header">
      <p class="brand">Tissaia</p>
      <div class="stitch"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <p class="subbrand">Carga rápida de mercadería</p>
      ${usingFallback ? '<p class="hint" style="margin-top:8px;color:var(--blush);">📱 Guardado en este dispositivo/navegador. Si lo abrís desde otro celular u otro navegador, no vas a ver estos datos.</p>' : ''}
    </div>
    <div class="panel" id="panel-catalogo"></div>
    <div class="panel active" id="panel-articulo"></div>
    <div class="panel" id="panel-movimiento"></div>
    <div class="panel" id="panel-exportar"></div>
    <div class="toast"><span class="toast-msg"></span><span class="toast-x">✕</span></div>
    <div class="error-overlay">
      <div class="error-card">

  function normHeaderCell(v){ return (v===undefined || v===null) ? '' : String(v).trim(); }

  async function importarDesdeArchivo(file){
    if(typeof XLSX === 'undefined'){
      throw new Error('No se pudo cargar el lector de Excel (revisá tu conexión a internet e intentá de nuevo).');
    }
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array' });

    const hojaPrecios = wb.Sheets['Precios, Costos y Presupuestos'];
    if(!hojaPrecios) throw new Error('No encontré la hoja "Precios, Costos y Presupuestos" en ese archivo.');
    const hojaVariantes = wb.Sheets['Variantes']; // opcional

    // Filas desde la 5 (index 4) de la hoja de Precios: A..L
    const filasPrecios = XLSX.utils.sheet_to_json(hojaPrecios, { header: 1, range: 4, blankrows: false });

    // Agrupar variantes por Código Base (columna B de la hoja Variantes)
    const variantesPorBase = {};
    if(hojaVariantes){
      const filasVar = XLSX.utils.sheet_to_json(hojaVariantes, { header: 1, range: 4, blankrows: false });
      filasVar.forEach(row=>{
        const codigoVariante = normHeaderCell(row[0]);
        const codigoBase = normHeaderCell(row[1]);
        if(!codigoVariante || !codigoBase) return;
        const talle = normHeaderCell(row[2]);
        const color = normHeaderCell(row[3]);
        (variantesPorBase[codigoBase] = variantesPorBase[codigoBase] || []).push({ codigo: codigoVariante, talle, color });
      });
    }

    let importados = 0;
    filasPrecios.forEach(row=>{
      const codigoBase = normHeaderCell(row[0]);
      const descripcion = normHeaderCell(row[1]);
      const categoria = normHeaderCell(row[2]);
      const costo = parseFloat(row[3]) || 0;
      const margenMenor = parseFloat(row[4]) || 0;
      const precioMenor = parseFloat(row[6]) || 0;
      const margenMayor = parseFloat(row[7]) || 0;
      const precioMayor = parseFloat(row[9]) || 0;
      if(!codigoBase || !descripcion) return;

      const variantes = (variantesPorBase[codigoBase] && variantesPorBase[codigoBase].length)
        ? variantesPorBase[codigoBase]
        : [{ codigo: codigoBase, talle: '', color: '' }];

      PRODUCTOS[codigoBase] = { codigoBase, categoria, descripcion, costo, margenMenor, margenMayor, precioMenor, precioMayor, variantes, fecha: PRODUCTOS[codigoBase]?.fecha || todayStr() };
      importados++;

      const m = codigoBase.match(/^([A-Z]+)-(\d+)$/);
      if(m){
        const abbr = m[1], num = parseInt(m[2],10);
        if(!CONTADORES[abbr] || CONTADORES[abbr] < num) CONTADORES[abbr] = num;
      }
    });

    if(!importados) throw new Error('No encontré artículos para importar en ese archivo.');
    await saveProductos();
    await saveContadores();
    toast(`Importados ${importados} artículos`);
    root.querySelector('#importar-status') && (root.querySelector('#importar-status').textContent = `✔ Importados ${importados} artículos correctamente.`);
  }

  const UNIDADES_COSTO = { "1": "por unidad", "6": "la media docena", "12": "la docena" };

  function costoUnitarioDesde(p, inputId, selectId){
    const monto = parseMoneyInput(p.querySelector('#'+inputId).value);
    const divisor = parseFloat(p.querySelector('#'+selectId).value) || 1;
    return monto / divisor;
  }

  function conectarCostoUnidad(p, inputId, selectId, hintId){
    const inputEl = p.querySelector('#'+inputId);
    attachMoneyMask(inputEl);
    function actualizar(){
      const monto = parseMoneyInput(inputEl.value);
      const divisor = parseFloat(p.querySelector('#'+selectId).value) || 1;
      const hint = p.querySelector('#'+hintId);
      if(!monto || divisor === 1){ hint.textContent = ''; return; }
      hint.innerHTML = `Costo unitario real: <b>${fmtMoney(monto/divisor)}</b> (se guarda así, dividido por ${divisor})`;
    }
    inputEl.addEventListener('input', actualizar);
    p.querySelector('#'+selectId).addEventListener('change', actualizar);
    actualizar();
  }

  function chipsUI(container, arr, soloLectura){
    container.innerHTML = arr.map((v,i)=>`<span class="chip">${v}${soloLectura?'':`<button data-i="${i}">✕</button>`}</span>`).join('');
    if(!soloLectura){
      container.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
        arr.splice(+b.dataset.i,1);
        chipsUI(container, arr, soloLectura);
      }));
    }
  }

  function construirVariantesNuevas(codigoBase, talles, colores){
    let variantes = [];
    if(talles.length && colores.length){
      talles.forEach(t=> colores.forEach(c=> variantes.push({
        codigo: `${codigoBase}-${t.toUpperCase().replace(/\s+/g,'')}-${c.toUpperCase().replace(/\s+/g,'')}`,
        talle: t, color: c
      })));
    } else if(talles.length){
      talles.forEach(t=> variantes.push({ codigo: `${codigoBase}-${t.toUpperCase().replace(/\s+/g,'')}`, talle: t, color: '' }));
    } else if(colores.length){
      colores.forEach(c=> variantes.push({ codigo: `${codigoBase}-${c.toUpperCase().replace(/\s+/g,'')}`, talle: '', color: c }));
    }
    const vistos = new Set();
    return variantes.filter(v => vistos.has(v.codigo) ? false : (vistos.add(v.codigo), true));
  }

  function renderFormCrear(){
    const p = root.querySelector('#bloque-modo-articulo');
    p.innerHTML = `

        <input type="text" id="input-color" placeholder="Ej: Negro" />

      </div>

      <button class="btn-primary" id="btn-guardar-articulo">Generar código y guardar</button>
    `;

    const catSel = p.querySelector('#f-categoria');
    function updateMargenHint(){
      const cat = catSel.value;
      const m = MARGENES[cat] || [0.45,0.28];
      p.querySelector('#f-margen-hint').innerHTML = `Por defecto para <b>${cat}</b>: ${Math.round(m[0]*100)}% menor · ${Math.round(m[1]*100)}% mayor (6+ u.)`;
    }
    catSel.addEventListener('change', updateMargenHint);
    updateMargenHint();
    conectarCostoUnidad(p, 'f-costo', 'f-costo-unidad', 'f-costo-hint');

    chipsUI(p.querySelector('#chips-talles'), tallesTmp);
    chipsUI(p.querySelector('#chips-colores'), coloresTmp);

    p.querySelector('#add-talle').addEventListener('click', ()=>{
      const inp = p.querySelector('#input-talle');
      if(inp.value.trim()){ tallesTmp.push(inp.value.trim()); inp.value=''; chipsUI(p.querySelector('#chips-talles'), tallesTmp); }
    });
    p.querySelector('#add-color').addEventListener('click', ()=>{
      const inp = p.querySelector('#input-color');
      if(inp.value.trim()){ coloresTmp.push(inp.value.trim()); inp.value=''; chipsUI(p.querySelector('#chips-colores'), coloresTmp); }
    });

    p.querySelector('#btn-guardar-articulo').addEventListener('click', async (ev)=>{
      const btn = ev.currentTarget;
      const categoria = catSel.value;
      const descripcion = p.querySelector('#f-descripcion').value.trim();
      const costo = costoUnitarioDesde(p, 'f-costo', 'f-costo-unidad');
      if(!descripcion || !costo){ toast('Falta descripción o costo'); return; }

      setLoading(btn, true, 'Guardando…');
      try {
        const abbr = CATS.find(c=>c[0]===categoria)[1];
        const codigoBase = nextCode(abbr);
        await saveContadores();

        const overrideMenor = p.querySelector('#f-margen-menor').value ? parseFloat(p.querySelector('#f-margen-menor').value)/100 : null;
        const overrideMayor = p.querySelector('#f-margen-mayor').value ? parseFloat(p.querySelector('#f-margen-mayor').value)/100 : null;
        const [defMenor, defMayor] = MARGENES[categoria] || [0.45,0.28];
        const margenMenor = overrideMenor ?? defMenor;
        const margenMayor = overrideMayor ?? defMayor;
        const precioMenor = costo * (1+margenMenor);
        const precioMayor = costo * (1+margenMayor);

        let variantes = construirVariantesNuevas(codigoBase, tallesTmp, coloresTmp);
        if(!variantes.length) variantes = [{ codigo: codigoBase, talle: '', color: '' }];

        const producto = { codigoBase, categoria, descripcion, costo, margenMenor, margenMayor, precioMenor, precioMayor, variantes, fecha: todayStr() };

        if(SHEETS_URL){
          try {
            await sheetsPost({ type: 'producto', data: { codigoBase, categoria, descripcion, costo, overrideMenor, overrideMayor, variantes } });
            PRODUCTOS[codigoBase] = producto;
            await saveProductos();
            toast(`Guardado en Google Sheets: ${codigoBase} (${variantes.length} variante${variantes.length>1?'s':''})`);
          } catch(e){
            if(e.esValidacion){ showError(e.message); return; }
            PRODUCTOS[codigoBase] = producto; await saveProductos();
            PEND_PROD.push(producto); await savePendProd();
            toast(`Sin conexión: ${codigoBase} quedó pendiente de sincronizar`);
          }
        } else {
          PRODUCTOS[codigoBase] = producto; await saveProductos();
          PEND_PROD.push(producto);
          await savePendProd();
          toast(`Guardado: ${codigoBase} (${variantes.length} variante${variantes.length>1?'s':''})`);
        }

        tallesTmp = []; coloresTmp = [];
        renderArticulo();
      } finally {
        setLoading(btn, false);
      }
    });
  }

          <input type="number" id="f-margen-mayor" value="${Math.round(pr.margenMayor*1000)/10}" />
        </div>
      </div>

      <label>Variantes existentes</label>
      <div class="chips">
        ${pr.variantes.map(v=>`<span class="chip" style="opacity:0.7;">${[v.talle,v.color].filter(Boolean).join(' · ') || 'única'}</span>`).join('') || '<span class="hint">Ninguna todavía</span>'}
      </div>

      <label style="margin-top:20px;">Agregar talles nuevos</label>
      <div class="chips" id="chips-talles"></div>
      <div class="add-chip-row">
        <input type="text" id="input-talle" placeholder="Ej: 100" />
        <button class="btn-mini" id="add-talle">+ Agregar</button>
      </div>

      <label>Agregar colores nuevos</label>
      <div class="chips" id="chips-colores"></div>
      <div class="add-chip-row">
        <input type="text" id="input-color" placeholder="Ej: Rojo" />
        <button class="btn-mini" id="add-color">+ Agregar</button>
      </div>
      <p class="hint" style="margin-top:8px;">Si cargás talles y/o colores nuevos, se van a sumar como variantes adicionales — las que ya existen no se tocan.</p>

      <button class="btn-primary" id="btn-guardar-cambios">Guardar cambios</button>
    `;

    p.querySelector('#cambiar-producto-editar').addEventListener('click', ()=>{
      productoEditando = null; renderFormEditar();
    });
    conectarCostoUnidad(p, 'f-costo', 'f-costo-unidad', 'f-costo-hint');

    chipsUI(p.querySelector('#chips-talles'), tallesTmp);
    chipsUI(p.querySelector('#chips-colores'), coloresTmp);
    p.querySelector('#add-talle').addEventListener('click', ()=>{
      const inp = p.querySelector('#input-talle');
      if(inp.value.trim()){ tallesTmp.push(inp.value.trim()); inp.value=''; chipsUI(p.querySelector('#chips-talles'), tallesTmp); }
    });
    p.querySelector('#add-color').addEventListener('click', ()=>{
      const inp = p.querySelector('#input-color');
      if(inp.value.trim()){ coloresTmp.push(inp.value.trim()); inp.value=''; chipsUI(p.querySelector('#chips-colores'), coloresTmp); }
    });

    p.querySelector('#btn-guardar-cambios').addEventListener('click', async (ev)=>{
      const btn = ev.currentTarget;
      const categoria = p.querySelector('#f-categoria').value;
      const descripcion = p.querySelector('#f-descripcion').value.trim();
      const costo = costoUnitarioDesde(p, 'f-costo', 'f-costo-unidad');
      const margenMenor = (parseFloat(p.querySelector('#f-margen-menor').value) || 0) / 100;
      const margenMayor = (parseFloat(p.querySelector('#f-margen-mayor').value) || 0) / 100;
      if(!descripcion || !costo){ toast('Falta descripción o costo'); return; }

      const variantesNuevas = construirVariantesNuevas(pr.codigoBase, tallesTmp, coloresTmp)
        .filter(v => !pr.variantes.some(ex => ex.codigo === v.codigo));

      setLoading(btn, true, 'Guardando cambios…');
      try {
        const actualizado = {
          ...pr, categoria, descripcion, costo, margenMenor, margenMayor,
          precioMenor: costo*(1+margenMenor), precioMayor: costo*(1+margenMayor),
          variantes: [...pr.variantes, ...variantesNuevas]
        };
        if(SHEETS_URL){
          try {
            await sheetsPost({ type: 'producto_actualizar', data: {
              codigoBase: pr.codigoBase, categoria, descripcion, costo,
              overrideMenor: margenMenor, overrideMayor: margenMayor, variantesNuevas
            }});
            PRODUCTOS[pr.codigoBase] = actualizado;
            await saveProductos();
            toast(`Actualizado: ${pr.codigoBase}${variantesNuevas.length ? ` (+${variantesNuevas.length} variante${variantesNuevas.length>1?'s':''})` : ''}`);
          } catch(e){
            if(e.esValidacion){ showError(e.message); return; }
            toast('Sin conexión: no se pudo actualizar, probá de nuevo en un rato');
            return;
          }
        } else {
          PRODUCTOS[pr.codigoBase] = actualizado;
          await saveProductos();
          toast('Actualizado en este dispositivo (sin conexión a Sheets)');
        }
        tallesTmp = []; coloresTmp = [];
        productoEditando = null;
        renderArticulo();
      } finally {
        setLoading(btn, false);
      }
    });
  }

  // ============================================================
  // PANEL 2: MOVIMIENTO
  // ============================================================
  let movTipo = 'Venta';
  let movMedioPago = 'Efectivo';
  let carritoTmp = [];
  let AJUSTES = [
    { nombre: 'Recargo Tarjeta Crédito', porcentaje: 6, signo: 1, activo: false },
    { nombre: 'Recargo Tarjeta Débito', porcentaje: 3, signo: 1, activo: false },
    { nombre: 'IVA', porcentaje: 21, signo: 1, activo: false },
    { nombre: 'IIBB', porcentaje: 3, signo: -1, activo: false },
    { nombre: 'Descuento', porcentaje: 10, signo: -1, activo: false },
  ];

  function textoBoton(){
    return movTipo === 'Venta' ? 'Guardar venta' : movTipo === 'Compra' ? 'Guardar compra' : 'Guardar gasto';
  }

  function renderMovimiento(){
    const p = root.querySelector('#panel-movimiento');
    productoSeleccionado = null;
    talleColorSeleccion = null;
    p.innerHTML = `
      <h2>Nuevo movimiento</h2>
      <p class="hint">Elegí el tipo, agregá uno o más artículos, y guardá todo junto.</p>

      <label>Fecha</label>
      <input type="date" id="f-fecha" value="${todayStr()}" />

      <label>Tipo de movimiento</label>
      <div class="type-toggle" id="tipo-toggle">
        <button data-t="Compra" class="${movTipo==='Compra'?'active':''}">Compra</button>
        <button data-t="Venta" class="${movTipo==='Venta'?'active':''}">Venta</button>
        <button data-t="Gasto" class="${movTipo==='Gasto'?'active':''}">Gasto</button>
      </div>

      <div id="bloque-gasto" style="display:none;">
        <label>Descripción del gasto</label>
        <input type="text" id="f-gasto-desc" placeholder="Ej: Pago de luz" />
        <label>Monto ($)</label>
        <input type="text" id="f-gasto-monto" placeholder="0" inputmode="decimal" />
      </div>

      <div id="bloque-carrito">
        <div id="bloque-articulo"></div>

        <div id="bloque-cantidad-precio"></div>

        <div class="section-label" style="margin-top:22px;">Artículos en esta operación</div>
        <div id="carrito-lista"></div>
        <div id="totales-carrito"></div>
      </div>

      <label style="margin-top:20px;">Ajustes (IVA, IIBB, recargos de tarjeta…)</label>
      <div id="ajustes-lista"></div>
      <div class="add-chip-row">
        <input type="text" id="input-ajuste-nombre" placeholder="Nombre (ej: Recargo Naranja)" />
        <input type="number" id="input-ajuste-pct" placeholder="%" style="max-width:64px; flex:none;" />
        <button class="btn-mini" id="add-ajuste">+</button>
      </div>

      <label>Medio de pago</label>
      <div class="pay-toggle" id="pago-toggle">
        <button data-m="Efectivo" class="${movMedioPago==='Efectivo'?'active':''}">Efectivo</button>
        <button data-m="Transferencia" class="${movMedioPago==='Transferencia'?'active':''}">Transferencia</button>
        <button data-m="Debito" class="${movMedioPago==='Debito'?'active':''}">Débito/Créd.</button>
      </div>

      <button class="btn-primary" id="btn-guardar-mov">${textoBoton()}</button>
    `;

    function actualizarVisibilidad(){
      const esGasto = movTipo === 'Gasto';
      p.querySelector('#bloque-gasto').style.display = esGasto ? 'block' : 'none';
      p.querySelector('#bloque-carrito').style.display = esGasto ? 'none' : 'block';
      p.querySelector('#btn-guardar-mov').textContent = textoBoton();
    }
    actualizarVisibilidad();

    root.querySelector('#tipo-toggle').querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(b.dataset.t !== movTipo) carritoTmp = []; // no mezclar articulos de venta con los de compra
        movTipo = b.dataset.t;
        root.querySelector('#tipo-toggle').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        actualizarVisibilidad();
        renderSeleccion();
        renderModoCarga(p);
        renderCarritoLista(p);
      });
    });
    root.querySelector('#pago-toggle').querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        movMedioPago = b.dataset.m;
        root.querySelector('#pago-toggle').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
      });
    });

    renderBloqueArticulo();
    renderAjustes(p);
    renderCarritoLista(p);
    renderModoCarga(p);

    const gastoMonto = p.querySelector('#f-gasto-monto');
    if(gastoMonto){ attachMoneyMask(gastoMonto); gastoMonto.addEventListener('input', ()=> renderCarritoLista(p)); }

    p.querySelector('#btn-guardar-mov').addEventListener('click', async (ev)=>{
      const btn = ev.currentTarget;
      const fecha = p.querySelector('#f-fecha').value;

      if(movTipo === 'Gasto'){
        const desc = p.querySelector('#f-gasto-desc').value.trim();
        const montoBase = parseMoneyInput(p.querySelector('#f-gasto-monto').value);
        if(!desc || !montoBase){ toast('Falta descripción o monto'); return; }
        const monto = calcularMontoFinal(montoBase);
        const efectivo = movMedioPago==='Efectivo'?monto:0, transferencia = movMedioPago==='Transferencia'?monto:0, debito = movMedioPago==='Debito'?monto:0;
        const fila = [fecha, '', desc, '', 'Gasto', 1, -Math.abs(monto), -Math.abs(efectivo), -Math.abs(transferencia), -Math.abs(debito), '', '', ''];

        setLoading(btn, true, 'Guardando…');
        try {
          if(SHEETS_URL){
            try {
              await sheetsPost({ type:'movimiento', data:{ fila } });
              toast('Gasto guardado en Google Sheets');
            } catch(e){
              if(e.esValidacion){ showError(e.message); return; }
              PEND_MOV.push({ fecha, movimiento:'Gasto', cantidad:1, efectivo, transferencia, debito, codigo:'', descripcion:desc, categoria:'', talle:'', color:'' });
              await savePendMov();
              toast('Sin conexión: quedó pendiente de sincronizar');
            }
          } else {
            PEND_MOV.push({ fecha, movimiento:'Gasto', cantidad:1, efectivo, transferencia, debito, codigo:'', descripcion:desc, categoria:'', talle:'', color:'' });
            await savePendMov();
            toast('Gasto agregado a la cola');
          }
          renderMovimiento();
        } finally {
          setLoading(btn, false);
        }
        return;
      }

      // Compra o Venta: se guardan todos los artículos del carrito
      if(!carritoTmp.length){ toast('Agregá al menos un artículo'); return; }
      const subtotalTotal = calcularSubtotalCarrito();
      const totalFinal = calcularMontoFinal(subtotalTotal);
      const signo = movTipo === 'Compra' ? -1 : 1;

      setLoading(btn, true, movTipo === 'Venta' ? 'Verificando stock…' : 'Guardando…');
      try {
        let exitosos = 0;
        const fallidos = [];
        for(const item of [...carritoTmp]){
          const montoLinea = subtotalTotal > 0 ? totalFinal * (item.subtotal / subtotalTotal) : 0;
          const efectivo = movMedioPago==='Efectivo'?montoLinea:0;
          const transferencia = movMedioPago==='Transferencia'?montoLinea:0;
          const debito = movMedioPago==='Debito'?montoLinea:0;
          const fila = [
            fecha, item.codigoVariante, item.descripcion, item.categoria, movTipo, item.cantidad,
            signo*Math.abs(montoLinea), signo*Math.abs(efectivo), signo*Math.abs(transferencia), signo*Math.abs(debito),
            item.color, '', item.talle
          ];
          if(SHEETS_URL){
            try {
              const payload = { type:'movimiento', data:{ fila } };
              if(movTipo === 'Compra'){
                payload.data.actualizarCosto = true;
                payload.data.codigoBase = item.codigoBase;
                payload.data.nuevoCostoUnitario = item.precioUnitario;
              }
              await sheetsPost(payload);
              if(movTipo === 'Compra' && PRODUCTOS[item.codigoBase]){
                PRODUCTOS[item.codigoBase].costo = item.precioUnitario;
                await saveProductos();
              }
              carritoTmp.splice(carritoTmp.indexOf(item), 1);
              exitosos++;
            } catch(e){
              if(e.esValidacion){
                fallidos.push(`${item.codigoVariante}: ${e.message}`);
              } else {
                PEND_MOV.push({ fecha, movimiento: movTipo, cantidad: item.cantidad, efectivo, transferencia, debito,
                  codigo: item.codigoVariante, descripcion: item.descripcion, categoria: item.categoria, talle: item.talle, color: item.color });
                await savePendMov();
                carritoTmp.splice(carritoTmp.indexOf(item), 1);
                exitosos++;
              }
            }
          } else {
            PEND_MOV.push({ fecha, movimiento: movTipo, cantidad: item.cantidad, efectivo, transferencia, debito,
              codigo: item.codigoVariante, descripcion: item.descripcion, categoria: item.categoria, talle: item.talle, color: item.color });
            await savePendMov();
            carritoTmp.splice(carritoTmp.indexOf(item), 1);
            exitosos++;
          }
        }
        if(fallidos.length) showError(fallidos.join('\n'));
        toast(exitosos ? `${exitosos} artículo${exitosos>1?'s':''} guardado${exitosos>1?'s':''}${fallidos.length?`, ${fallidos.length} con error`:''}` : 'No se guardó nada, revisá los errores');
        renderMovimiento();
      } finally {
        setLoading(btn, false);
      }
    });

    updatePrecioSugerido();
  }

  // ============================================================
  // Cantidad / Precio: modo único (una sola variante) o modo variantes
  // (elegís la base una vez, y vas agregando talle+color+cantidad de a uno,
  // sin repetir la búsqueda ni el costo cada vez)
  // ============================================================
  let subCarritoVariantes = [];

  function renderModoCarga(p){
    const cont = p.querySelector('#bloque-cantidad-precio');
    if(!cont) return;
    if(!productoSeleccionado){ cont.innerHTML = ''; subCarritoVariantes = []; return; }
    if(productoSeleccionado.variantes.length > 1) renderModoVariantes(p, cont);
    else renderModoUnico(p, cont);
  }

  function renderModoUnico(p, cont){
    cont.innerHTML = `
      <label>Cantidad</label>
      <input type="number" id="f-cantidad" value="1" min="1" />
      <p class="suggested-price" id="precio-sugerido"></p>
      <label id="label-precio-unitario">${movTipo === 'Compra' ? 'Costo' : 'Precio unitario ($)'}</label>
      <div class="row2">
        <input type="text" id="f-precio-unitario" placeholder="0" inputmode="decimal" />
        <select id="f-precio-unidad" style="${movTipo === 'Compra' ? '' : 'display:none;'}">
          <option value="1">Por unidad</option>
          <option value="6">La media docena</option>
          <option value="12">La docena</option>
        </select>
      </div>
      <p class="hint" id="f-precio-unidad-hint" style="margin-top:6px;"></p>
      <p class="suggested-price" id="ganancia-hint"></p>
      <button class="btn-secondary" type="button" id="btn-agregar-linea">+ Agregar artículo</button>
    `;
    cont.querySelector('#f-cantidad').addEventListener('input', updatePrecioSugerido);
    attachMoneyMask(cont.querySelector('#f-precio-unitario'));
    cont.querySelector('#f-precio-unitario').addEventListener('input', ()=>{ actualizarGananciaHint(p); actualizarPrecioUnidadHint(p); });
    cont.querySelector('#f-precio-unidad').addEventListener('change', ()=> actualizarPrecioUnidadHint(p));

    cont.querySelector('#btn-agregar-linea').addEventListener('click', ()=>{
      if(!productoSeleccionado){ toast('Elegí un artículo primero'); return; }
      const variante = productoSeleccionado.variantes[0];
      const cantidad = parseFloat(cont.querySelector('#f-cantidad').value) || 0;
      const precioUnitario = costoUnitarioDesde(cont, 'f-precio-unitario', 'f-precio-unidad');
      if(!cantidad || !precioUnitario){ toast('Falta cantidad o precio unitario'); return; }

      carritoTmp.push({
        codigoVariante: variante.codigo, codigoBase: productoSeleccionado.codigoBase,
        descripcion: productoSeleccionado.descripcion, categoria: productoSeleccionado.categoria,
        talle: variante.talle, color: variante.color,
        cantidad, precioUnitario, subtotal: cantidad * precioUnitario,
        esCompra: movTipo === 'Compra'
      });

      productoSeleccionado = null; talleColorSeleccion = null;
      renderBloqueArticulo();
      renderModoCarga(p);
      renderCarritoLista(p);
      toast(`${variante.codigo} agregado`);
    });

    updatePrecioSugerido();
  }

  function renderModoVariantes(p, cont){
    subCarritoVariantes = [];
    const esCompra = movTipo === 'Compra';
    const pr = productoSeleccionado;

    cont.innerHTML = `
      ${esCompra ? `
        <label>Costo (se aplica igual a todas las variantes que agregues abajo)</label>
        <div class="row2">
          <input type="text" id="v-costo" placeholder="0" inputmode="decimal" />
          <select id="v-costo-unidad">
            <option value="1">Por unidad</option>
            <option value="6">La media docena</option>
            <option value="12">La docena</option>
          </select>
        </div>
        <p class="hint" id="v-costo-hint" style="margin-top:6px;"></p>
      ` : ''}
      <div id="bloque-entrada-variante" style="margin-top:${esCompra?'18px':'0'};"></div>
    `;

    if(esCompra){
      attachMoneyMask(cont.querySelector('#v-costo'));
      const actualizarHintCosto = ()=>{
        const hint = cont.querySelector('#v-costo-hint');
        const monto = parseMoneyInput(cont.querySelector('#v-costo').value);
        const divisor = parseFloat(cont.querySelector('#v-costo-unidad').value) || 1;
        if(!monto || divisor===1){ hint.textContent=''; return; }
        hint.innerHTML = `Costo unitario real: <b>${fmtMoney(monto/divisor)}</b> (dividido por ${divisor})`;
      };
      cont.querySelector('#v-costo').addEventListener('input', actualizarHintCosto);
      cont.querySelector('#v-costo-unidad').addEventListener('change', actualizarHintCosto);
    }

    renderEntradaVariante(p, cont);
  }

  function renderEntradaVariante(p, cont){
    const pr = productoSeleccionado;
    const esCompra = movTipo === 'Compra';
    const talles = [...new Set(pr.variantes.map(v=>v.talle).filter(Boolean))];
    const colores = [...new Set(pr.variantes.map(v=>v.color).filter(Boolean))];
    const bloque = cont.querySelector('#bloque-entrada-variante');

    bloque.innerHTML = `
      <p class="hint">Elegí talle y color, indicá la cantidad, y "Agregar variante" tantas veces como necesites — sin volver a buscar ${pr.codigoBase}.</p>
      ${talles.length ? `<label>Talle</label><select id="v-talle"><option value="">Elegir talle…</option>${talles.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>` : ''}
      ${colores.length ? `<label>Color</label><select id="v-color"><option value="">Elegir color…</option>${colores.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>` : ''}
      <label>Cantidad</label>
      <input type="number" id="v-cantidad" value="1" min="1" />
      ${!esCompra ? `
        <p class="suggested-price" id="v-precio-sugerido">Precio por menor: <b>${fmtMoney(pr.precioMenor)}</b> c/u &nbsp;·&nbsp; Precio por mayor (6+ u.): <b>${fmtMoney(pr.precioMayor)}</b> c/u</p>
        <label>Precio unitario ($)</label>
        <input type="text" id="v-precio" placeholder="0" inputmode="decimal" />
        <p class="suggested-price" id="v-ganancia-hint"></p>
      ` : ''}
      <p class="hint" id="v-combo-hint" style="margin-top:6px;"></p>
      <button class="btn-secondary" type="button" id="btn-agregar-variante">+ Agregar variante</button>

      <div class="section-label" style="margin-top:20px;">Variantes de ${pr.codigoBase} en esta operación</div>
      <div id="pendientes-variantes"></div>
      <button class="btn-primary" type="button" id="btn-agregar-articulos" style="margin-top:14px;">Agregar artículos al carrito</button>
    `;

    function resolverCombo(){
      const talle = bloque.querySelector('#v-talle') ? bloque.querySelector('#v-talle').value : '';
      const color = bloque.querySelector('#v-color') ? bloque.querySelector('#v-color').value : '';
      if((talles.length && !talle) || (colores.length && !color)) return null;
      return pr.variantes.find(v => (v.talle||'') === talle && (v.color||'') === color) || undefined;
    }
    function actualizarComboHint(){
      const hint = bloque.querySelector('#v-combo-hint');
      const talleSel = bloque.querySelector('#v-talle'), colorSel = bloque.querySelector('#v-color');
      const talle = talleSel ? talleSel.value : '', color = colorSel ? colorSel.value : '';
      if((talles.length && !talle) || (colores.length && !color)){ hint.textContent = ''; return; }
      const match = resolverCombo();
      hint.innerHTML = match ? '' : `<span style="color:var(--danger);">Esa combinación no existe en el catálogo.</span>`;
    }
    if(bloque.querySelector('#v-talle')) bloque.querySelector('#v-talle').addEventListener('change', actualizarComboHint);
    if(bloque.querySelector('#v-color')) bloque.querySelector('#v-color').addEventListener('change', actualizarComboHint);
    if(!esCompra){
      const precioInput = bloque.querySelector('#v-precio');
      attachMoneyMask(precioInput);
      precioInput.addEventListener('input', ()=>{
        const cant = parseFloat(bloque.querySelector('#v-cantidad').value) || 0;
        const precioUnit = parseMoneyInput(precioInput.value);
        const hint = bloque.querySelector('#v-ganancia-hint');
        if(!cant || !precioUnit){ hint.textContent=''; return; }
        const gananciaUnit = precioUnit - pr.costo;
        const pct = pr.costo>0 ? (gananciaUnit/pr.costo)*100 : 0;
        const color = gananciaUnit>=0 ? 'var(--ok)' : 'var(--danger)';
        hint.innerHTML = `Ganancia: <b style="color:${color}">${fmtMoney(gananciaUnit)} c/u (${pct.toFixed(1)}%)</b>`;
      });
    }

    bloque.querySelector('#btn-agregar-variante').addEventListener('click', ()=>{
      const match = resolverCombo();
      if(match === null){ toast('Elegí talle y color primero'); return; }
      if(!match){ toast('Esa combinación no existe en el catálogo'); return; }
      const cantidad = parseFloat(bloque.querySelector('#v-cantidad').value) || 0;
      if(!cantidad){ toast('Cargá la cantidad'); return; }
      let precioUnitario;
      if(esCompra){
        precioUnitario = costoUnitarioDesde(cont, 'v-costo', 'v-costo-unidad');
        if(!precioUnitario){ toast('Cargá el costo primero'); return; }
      } else {
        precioUnitario = parseMoneyInput(bloque.querySelector('#v-precio').value);
        if(!precioUnitario){ toast('Cargá el precio unitario'); return; }
      }

      subCarritoVariantes.push({
        codigoVariante: match.codigo, codigoBase: pr.codigoBase,
        descripcion: pr.descripcion, categoria: pr.categoria,
        talle: match.talle, color: match.color,
        cantidad, precioUnitario, subtotal: cantidad*precioUnitario, esCompra
      });
      renderEntradaVariante(p, cont); // resetea talle/color/cantidad/precio, mantiene el costo global
      toast(`${match.codigo} agregado a la lista`);
    });

    const pend = bloque.querySelector('#pendientes-variantes');
    if(!subCarritoVariantes.length){
      pend.innerHTML = `<p class="hint">Todavía no agregaste ninguna variante de este artículo.</p>`;
    } else {
      pend.innerHTML = subCarritoVariantes.map((it,i)=>`
        <div class="queue-item">
          <div class="qi-top"><span>${it.codigoVariante}</span><button type="button" class="quitar-pendiente" data-i="${i}" style="background:none;border:none;color:var(--danger);font-size:14px;cursor:pointer;">✕ Quitar</button></div>
          <div class="qi-meta">${it.cantidad} × ${fmtMoney(it.precioUnitario)} = <b>${fmtMoney(it.subtotal)}</b></div>
        </div>
      `).join('');
      pend.querySelectorAll('.quitar-pendiente').forEach(btn=>btn.addEventListener('click', ()=>{
        subCarritoVariantes.splice(+btn.dataset.i, 1);
        renderEntradaVariante(p, cont);
      }));
    }

    bloque.querySelector('#btn-agregar-articulos').addEventListener('click', ()=>{
      if(!subCarritoVariantes.length){ toast('Agregá al menos una variante primero'); return; }
      carritoTmp.push(...subCarritoVariantes);
      const cantidadAgregada = subCarritoVariantes.length;
      subCarritoVariantes = [];
      productoSeleccionado = null; talleColorSeleccion = null;
      renderBloqueArticulo();
      renderModoCarga(p);
      renderCarritoLista(p);
      toast(`${cantidadAgregada} variante${cantidadAgregada>1?'s':''} de ${pr.codigoBase} agregada${cantidadAgregada>1?'s':''} al carrito`);
    });
  }

  function calcularSubtotalCarrito(){
    return carritoTmp.reduce((a,i)=>a+i.subtotal, 0);
  }

  function renderCarritoLista(p){
    const cont = p.querySelector('#carrito-lista');
    if(!cont) return;
    if(!carritoTmp.length){
      cont.innerHTML = `<p class="hint">Todavía no agregaste ningún artículo.</p>`;
    } else {
      cont.innerHTML = carritoTmp.map((item,i)=>`
        <div class="queue-item">
          <div class="qi-top"><span>${item.codigoVariante}</span><button type="button" class="carrito-quitar" data-i="${i}" style="background:none;border:none;color:var(--danger);font-size:14px;cursor:pointer;">✕ Quitar</button></div>
          <div class="qi-desc">${item.descripcion}${(item.talle||item.color) ? ' · '+[item.talle,item.color].filter(Boolean).join(' · ') : ''}</div>
          <div class="qi-meta">${item.cantidad} × ${fmtMoney(item.precioUnitario)} = <b>${fmtMoney(item.subtotal)}</b></div>
        </div>
      `).join('');
      cont.querySelectorAll('.carrito-quitar').forEach(btn=>btn.addEventListener('click', ()=>{
        carritoTmp.splice(+btn.dataset.i, 1);
        renderCarritoLista(p);
      }));
    }
    renderTotales(p);
  }

  function renderTotales(p){
    const cont = p.querySelector('#totales-carrito');
    if(!cont) return;
    const esGasto = movTipo === 'Gasto';
    const subtotal = esGasto ? parseMoneyInput(p.querySelector('#f-gasto-monto')?.value) : calcularSubtotalCarrito();
    if(!subtotal){ cont.innerHTML=''; return; }
    const activos = AJUSTES.filter(a=>a.activo);
    const total = calcularMontoFinal(subtotal);
    let html = `<div class="ajuste-row" style="background:none;border:none;padding:6px 0;"><span class="ajuste-nombre">Subtotal</span><b>${fmtMoney(subtotal)}</b></div>`;
    activos.forEach(a=>{
      const efecto = subtotal * (a.signo * a.porcentaje / 100);
      html += `<div class="ajuste-row" style="background:none;border:none;padding:4px 0;"><span class="ajuste-nombre" style="font-size:12.5px;color:var(--ink-dim);">${a.signo>0?'+':'−'} ${a.porcentaje}% ${a.nombre}</span><span style="color:var(--ink-dim);">${fmtMoney(Math.abs(efecto))}</span></div>`;
    });
    html += `<div class="ajuste-row" style="background:var(--gold-soft);border:1px solid var(--gold);padding:10px;"><span class="ajuste-nombre" style="color:var(--gold);font-weight:700;">TOTAL</span><b style="color:var(--gold);font-size:16px;">${fmtMoney(total)}</b></div>`;
    cont.innerHTML = html;
  }

  function renderBloqueArticulo(){
    const p = root.querySelector('#panel-movimiento');
    const bloque = p.querySelector('#bloque-articulo');
    bloque.innerHTML = `
      <label>Buscar artículo</label>
      <input type="text" id="f-buscar" placeholder="Código o descripción…" />
      <div id="resultados-busqueda"></div>
      <div id="seleccion-producto"></div>
      <div id="seleccion-variante"></div>
    `;
    bloque.querySelector('#f-buscar').addEventListener('input', (e)=>{
      const q = e.target.value.trim().toLowerCase();
      const cont = bloque.querySelector('#resultados-busqueda');
      if(!q){ cont.innerHTML=''; return; }
      const matches = Object.values(PRODUCTOS).filter(pr =>
        pr.codigoBase.toLowerCase().includes(q) || pr.descripcion.toLowerCase().includes(q)
      ).slice(0,8);
      cont.innerHTML = matches.map(m=>`
        <div class="search-result" data-code="${m.codigoBase}">
          <div class="sr-code">${m.codigoBase} · ${m.categoria}</div>
          <div class="sr-desc">${m.descripcion}</div>
        </div>`).join('') || `<p class="hint">Sin resultados. ¿Lo cargaste en "Artículo"?</p>`;
      cont.querySelectorAll('.search-result').forEach(r=>{
        r.addEventListener('click', ()=>{
          productoSeleccionado = PRODUCTOS[r.dataset.code];
          talleColorSeleccion = null;
          cont.innerHTML='';
          bloque.querySelector('#f-buscar').value='';
          renderSeleccion();
          renderModoCarga(root.querySelector('#panel-movimiento'));
        });
      });
    });
  }

  function renderSeleccion(){
    const bloque = root.querySelector('#bloque-articulo');
    const contP = bloque.querySelector('#seleccion-producto');
    const contV = bloque.querySelector('#seleccion-variante');
    if(!productoSeleccionado){ contP.innerHTML=''; contV.innerHTML=''; return; }
    contP.innerHTML = `
      <div class="selected-product">
        <div><div class="sp-code">${productoSeleccionado.codigoBase}</div>${productoSeleccionado.descripcion}</div>
        <button id="quitar-producto">Cambiar</button>
      </div>`;
    contP.querySelector('#quitar-producto').addEventListener('click', ()=>{
      productoSeleccionado = null; talleColorSeleccion = null;
      renderSeleccion();
      renderModoCarga(root.querySelector('#panel-movimiento'));
    });

    // El talle/color para artículos con variantes se elige dentro de "renderModoVariantes"
    // (tanto en Compra como en Venta) — acá solo resolvemos el caso de una sola variante.
    const variantes = productoSeleccionado.variantes;
    talleColorSeleccion = variantes.length === 1 ? variantes[0] : null;
    contV.innerHTML = '';
  }

  function updatePrecioSugerido(){
    const p = root.querySelector('#panel-movimiento');
    if(!p) return;
    const hint = p.querySelector('#precio-sugerido');
    if(!hint) return;
    if(movTipo==='Gasto' || !productoSeleccionado){ hint.textContent=''; actualizarGananciaHint(p); return; }
    if(movTipo==='Compra'){
      hint.innerHTML = `Costo de referencia: <b>${fmtMoney(productoSeleccionado.costo)}</b> por unidad`;
    } else {
      hint.innerHTML = `Precio por menor: <b>${fmtMoney(productoSeleccionado.precioMenor)}</b> c/u &nbsp;·&nbsp; Precio por mayor (6+ u.): <b>${fmtMoney(productoSeleccionado.precioMayor)}</b> c/u`;
    }
    actualizarGananciaHint(p);
  }

  function actualizarPrecioUnidadHint(p){
    const hint = p.querySelector('#f-precio-unidad-hint');
    if(!hint) return;
    const monto = parseMoneyInput(p.querySelector('#f-precio-unitario').value);
    const divisor = parseFloat(p.querySelector('#f-precio-unidad').value) || 1;
    if(!monto || divisor === 1){ hint.textContent = ''; return; }
    hint.innerHTML = `Costo unitario real: <b>${fmtMoney(monto/divisor)}</b> (se guarda así, dividido por ${divisor})`;
  }

  function actualizarGananciaHint(p){
    const hint = p.querySelector('#ganancia-hint');
    if(!hint) return;
    if(movTipo !== 'Venta' || !productoSeleccionado){ hint.textContent=''; return; }
    const cant = parseFloat(p.querySelector('#f-cantidad').value) || 0;
    const precioUnit = parseMoneyInput(p.querySelector('#f-precio-unitario').value);
    const costo = productoSeleccionado.costo || 0;
    if(!cant || !precioUnit){ hint.textContent=''; return; }

    const gananciaUnit = precioUnit - costo;
    const gananciaTotal = gananciaUnit * cant;
    const pctGanancia = costo > 0 ? (gananciaUnit / costo) * 100 : 0;
    const color = gananciaTotal >= 0 ? 'var(--ok)' : 'var(--danger)';

    hint.innerHTML = `Ganancia sobre el costo (${fmtMoney(costo)} c/u): ` +
      `<b style="color:${color}">${fmtMoney(gananciaUnit)} c/u (${pctGanancia.toFixed(1)}%)</b> · ` +
      `Total: <b style="color:${color}">${fmtMoney(gananciaTotal)} (${pctGanancia.toFixed(1)}%)</b>`;
  }

  function renderAjustes(p){
    const cont = p.querySelector('#ajustes-lista');
    if(!cont) return;
    cont.innerHTML = AJUSTES.map((a,i)=>`
      <div class="ajuste-row" data-i="${i}">
        <input type="checkbox" class="ajuste-check" data-i="${i}" ${a.activo?'checked':''}>
        <span class="ajuste-nombre">${a.nombre}</span>
        <button type="button" class="ajuste-signo" data-i="${i}">${a.signo>0?'+':'−'}</button>
        <input type="number" class="ajuste-pct" data-i="${i}" value="${a.porcentaje}">
        <span>%</span>
        ${a.personalizado ? `<button type="button" class="ajuste-borrar" data-i="${i}">✕</button>` : ''}
      </div>
    `).join('');

    cont.querySelectorAll('.ajuste-check').forEach(chk=>chk.addEventListener('change', ()=>{
      AJUSTES[+chk.dataset.i].activo = chk.checked;
      renderTotales(p);
    }));
    cont.querySelectorAll('.ajuste-signo').forEach(btn=>btn.addEventListener('click', ()=>{
      const a = AJUSTES[+btn.dataset.i];
      a.signo = a.signo > 0 ? -1 : 1;
      renderAjustes(p);
    }));
    cont.querySelectorAll('.ajuste-pct').forEach(inp=>inp.addEventListener('input', ()=>{
      AJUSTES[+inp.dataset.i].porcentaje = parseFloat(inp.value) || 0;
      renderTotales(p);
    }));
    cont.querySelectorAll('.ajuste-borrar').forEach(btn=>btn.addEventListener('click', ()=>{
      AJUSTES.splice(+btn.dataset.i, 1);
      renderAjustes(p);
    }));

    p.querySelector('#add-ajuste').onclick = ()=>{
      const nombre = p.querySelector('#input-ajuste-nombre').value.trim();
      const pct = parseFloat(p.querySelector('#input-ajuste-pct').value) || 0;
      if(!nombre){ toast('Ponele un nombre al ajuste'); return; }
      AJUSTES.push({ nombre, porcentaje: pct, signo: 1, activo: true, personalizado: true });
      p.querySelector('#input-ajuste-nombre').value = '';
      p.querySelector('#input-ajuste-pct').value = '';
      renderAjustes(p);
    };

    renderTotales(p);
  }

  function calcularMontoFinal(montoBase){
    let total = montoBase;
    AJUSTES.filter(a=>a.activo).forEach(a=>{
      total = total * (1 + (a.signo * a.porcentaje / 100));
    });
    return total;
  }


  // ============================================================
  // PANEL 3: EXPORTAR
  // ============================================================
  function renderExportar(){
    const p = root.querySelector('#panel-exportar');
    const conectado = !!SHEETS_URL;
    p.innerHTML = `
      <h2>${conectado ? 'Pendientes de sincronizar' : 'Exportar a Excel'}</h2>
      <p class="hint">${conectado
        ? 'Esto solo se llena si algún movimiento o artículo se guardó sin conexión a internet. Tocá "Reintentar" para mandarlo a Google Sheets.'
        : 'Copiá cada bloque y pegalo (Ctrl+V) en la hoja correspondiente del Excel. Después tocá "Vaciar cola" para no exportarlo dos veces.'}</p>

      ${conectado ? `<button class="btn-primary" id="btn-reintentar">Reintentar sincronización (${PEND_MOV.length + PEND_PROD.length})</button>` : ''}

      <div class="section-label">Movimientos pendientes (${PEND_MOV.length}) → hoja "Registro Compras y Ventas"</div>
      <textarea class="copybox" id="box-mov" readonly></textarea>
      <button class="btn-secondary" id="copiar-mov">Copiar movimientos</button>
      <button class="btn-secondary" id="vaciar-mov">Vaciar cola de movimientos</button>

      <div class="section-label">Artículos nuevos (${PEND_PROD.length}) → hojas "Precios, Costos y Presupuestos" y "Variantes"</div>
      <textarea class="copybox" id="box-prod-precios" readonly></textarea>
      <p class="hint" style="margin:8px 0 0;">↑ Pegar en "Precios, Costos y Presupuestos" (columnas A-D)</p>
      <textarea class="copybox" id="box-prod-variantes" style="margin-top:14px;" readonly></textarea>
      <p class="hint" style="margin:8px 0 0;">↑ Pegar en "Variantes" (columna A)</p>
      <button class="btn-secondary" id="copiar-prod">Copiar ambos bloques</button>
      <button class="btn-secondary" id="vaciar-prod">Vaciar cola de artículos</button>
    `;

    const btnReintentar = p.querySelector('#btn-reintentar');
    if(btnReintentar) btnReintentar.addEventListener('click', async ()=>{
      let ok = 0, fail = 0;
      for(const registro of [...PEND_MOV]){
        const total = registro.efectivo + registro.transferencia + registro.debito;
        const signo = (registro.movimiento === 'Compra' || registro.movimiento === 'Gasto') ? -1 : 1;
        const fila = [registro.fecha, registro.codigo, registro.descripcion, registro.categoria, registro.movimiento,
          registro.cantidad, signo*Math.abs(total), signo*Math.abs(registro.efectivo), signo*Math.abs(registro.transferencia),
          signo*Math.abs(registro.debito), registro.color, '', registro.talle];
        try { await sheetsPost({ type:'movimiento', data:{ fila } }); PEND_MOV.splice(PEND_MOV.indexOf(registro),1); ok++; }
        catch(e){ fail++; }
      }
      for(const producto of [...PEND_PROD]){
        try {
          await sheetsPost({ type:'producto', data: producto });
          PEND_PROD.splice(PEND_PROD.indexOf(producto),1); ok++;
        } catch(e){ fail++; }
      }
      await savePendMov(); await savePendProd();
      toast(fail ? `Sincronizados ${ok}, fallaron ${fail}` : `Todo sincronizado (${ok})`);
      renderExportar();
    });

    const movTsv = PEND_MOV.map(m =>
      [m.fecha, m.codigo, m.descripcion, m.categoria, m.movimiento, m.cantidad, m.movimiento==='Compra' ? -Math.abs(m.efectivo+m.transferencia+m.debito) : (m.efectivo+m.transferencia+m.debito), m.efectivo||'', m.transferencia||'', m.debito||'', m.color||'', '', m.talle||''].join('\t')
    ).join('\n');
    p.querySelector('#box-mov').value = movTsv;

    const precioTsv = PEND_PROD.map(pr => [pr.codigoBase, pr.descripcion, pr.categoria, pr.costo].join('\t')).join('\n');
    p.querySelector('#box-prod-precios').value = precioTsv;
    const variantesTsv = PEND_PROD.flatMap(pr => pr.variantes.map(v=>v.codigo)).join('\n');
    p.querySelector('#box-prod-variantes').value = variantesTsv;

    p.querySelector('#copiar-mov').addEventListener('click', ()=>{
      navigator.clipboard.writeText(movTsv).then(()=>toast('Movimientos copiados'));
    });
    p.querySelector('#copiar-prod').addEventListener('click', ()=>{
      navigator.clipboard.writeText(precioTsv + '\n\n---VARIANTES---\n' + variantesTsv).then(()=>toast('Artículos copiados'));
    });
    p.querySelector('#vaciar-mov').addEventListener('click', async ()=>{
      if(!PEND_MOV.length) return;
      PEND_MOV = []; await savePendMov(); toast('Cola de movimientos vacía'); renderExportar();
    });
    p.querySelector('#vaciar-prod').addEventListener('click', async ()=>{
      if(!PEND_PROD.length) return;
      PEND_PROD = []; await savePendProd(); toast('Cola de artículos vacía'); renderExportar();
    });
  }

  // ---------- init ----------
  initErrorOverlay();
  initToast();
  loadAll().then(async ()=>{
    if(SHEETS_URL){
      await sincronizarCatalogoDesdeSheets(true); // esperamos esto ANTES de pintar la pantalla
    }
    renderArticulo();
    if(!SHEETS_URL && Object.keys(PRODUCTOS).length === 0){
      root.querySelector('[data-tab="catalogo"]').click();
    }
  });
})();
</script>
